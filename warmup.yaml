# Warmup content from the Main Guide → Warmup. Chinese names are drafts (🔍 zh-names).
general:
  en: 5 minutes of light cardio, or until you're in a light sweat. Brisk walking or the stairmaster works. If you're running, it's too intense.
  zh: 5 分鐘輕量帶氧運動，或直至微微出汗。快走或樓梯機均可。如果在跑步，強度就太高了。

dynamic:
  upper:
    - {en: Shoulder circles / arm circles, zh: 手臂繞環}
    - {en: Side-to-side arm swings, zh: 左右擺臂}
    - {en: Band pull-aparts, zh: 彈力帶拉開}
    - {en: Band pass-throughs, zh: 彈力帶過頭繞肩}
    - {en: Band shoulder external rotation, zh: 彈力帶肩外旋}
    - {en: Band shoulder internal rotation, zh: 彈力帶肩內旋}
  lower:
    - {en: Front-to-back leg swings, zh: 前後擺腿}
    - {en: Side-to-side leg swings, zh: 左右擺腿}
    - {en: Step-throughs with pause, zh: 跨步停頓}
    - {en: Hamstring rotating squats, zh: 腿後肌轉體深蹲}
    - {en: 90-90 hip flips, zh: 90-90 髖部翻轉}
    - {en: 90-90 heel clicks, zh: 90-90 腳跟碰觸}
    - {en: Banded terminal knee extension, zh: 彈力帶終末伸膝}
  reps: "10–12"
