# RealiGym exercise library
# Every exercise lives here exactly once. Programmes reference exercises by `id`.
#
# Fields
#   id            unique snake_case id (never rename once logs exist — logs point at it)
#   name          {en, zh}   (zh names are drafts → see review item "zh-names")
#   type          compound | isolation
#   equipment     list of: barbell, dumbbell, cable, machine, bodyweight
#   muscles       primary muscles trained
#   alternatives  ids of exercises that can replace this one (used for equipment swaps)
#   video_url     demo video link — fill in later
#   form_cues     list of {en, zh} cues — empty until the Form Guide is written (🔍 form-guide)

# ---------- Chest ----------
- id: machine_chest_press
  name: {en: Machine chest press, zh: 器械胸推}
